<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MDEF Archive — 5 years</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: oklch(0.97 0.008 85);
    --paper-2: oklch(0.94 0.012 80);
    --ink: oklch(0.18 0.01 60);
    --ink-2: oklch(0.36 0.01 60);
    --ink-3: oklch(0.52 0.008 60);
    --line: oklch(0.82 0.01 70);
    --accent: oklch(0.58 0.17 35);
    --accent-2: oklch(0.55 0.12 240);
    --card-bg: #fbfaf5;
    --card-bg-hi: #ffffff;
    --sans: 'Söhne', 'Helvetica Neue', Helvetica, 'Inter Tight', system-ui, sans-serif;
    --serif: 'Fraunces', 'Instrument Serif', Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* === Toolbar === */
  .toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 14px 20px 0 20px;
    gap: 20px;
    background: linear-gradient(to bottom, var(--paper) 0%, var(--paper) 78%, rgba(247,243,233,0) 100%);
    padding-bottom: 14px;
  }
  .tb-left .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--ink); color: var(--paper);
    display: grid; place-items: center; font-size: 16px;
  }
  .brand-title { font-family: var(--serif); font-size: 18px; font-weight: 500; letter-spacing: -0.01em; }
  .brand-sub { font-size: 11px; color: var(--ink-3); margin-top: 1px; letter-spacing: 0.01em; }

  .tb-center { justify-self: center; }
  .search-wrap {
    display: flex; align-items: center; gap: 8px;
    background: var(--card-bg); border: 1px solid var(--line);
    padding: 8px 12px; border-radius: 999px;
    width: 420px;
    transition: border-color 0.2s;
  }
  .search-wrap:focus-within { border-color: var(--ink-2); background: var(--card-bg-hi); }
  .search-wrap input {
    flex: 1; border: 0; background: transparent; outline: none;
    font-family: var(--sans); font-size: 13px; color: var(--ink);
  }
  .search-wrap .x {
    border: 0; background: transparent; cursor: pointer; color: var(--ink-3);
    font-size: 16px; padding: 0 4px;
  }

  .tb-right { justify-self: end; }
  .zoom-group { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card-bg); }
  .zoom-group button {
    border: 0; background: transparent; padding: 8px 14px;
    font-family: var(--sans); font-size: 13px; cursor: pointer;
    color: var(--ink); border-right: 1px solid var(--line);
  }
  .zoom-group button:last-child { border-right: 0; }
  .zoom-group button:hover { background: var(--paper-2); }

  .filter-bar {
    grid-column: 1 / -1;
    display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
    margin-top: 12px;
  }
  .filter-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .filter-label {
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-3); margin-right: 4px;
  }
  .chip {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-2);
    padding: 5px 10px;
    border-radius: 999px;
    font-family: var(--sans); font-size: 11.5px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all 0.15s;
  }
  .chip:hover { border-color: var(--ink-2); color: var(--ink); }
  .chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .chip-clear {
    border: 0; background: transparent; color: var(--ink-3);
    font-size: 11px; cursor: pointer; text-decoration: underline;
    margin-left: auto;
  }
  .chip-clear:hover { color: var(--ink); }

  .tag-dd { position: relative; }
  .tag-dd-pop {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 200;
    width: 280px; max-height: 360px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 12px 40px rgba(26,20,9,0.18);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .tag-dd-search {
    border: 0; border-bottom: 1px solid var(--line);
    padding: 10px 12px;
    font-family: 'Söhne', sans-serif; font-size: 12px;
    background: transparent; color: var(--ink); outline: none;
  }
  .tag-dd-list { overflow: auto; max-height: 280px; padding: 4px 0; }
  .tag-dd-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; cursor: pointer;
    font-size: 12px; color: var(--ink);
  }
  .tag-dd-row:hover { background: var(--paper-2); }
  .tag-dd-row input { margin: 0; accent-color: var(--ink); }
  .tag-dd-label { flex: 1; text-transform: capitalize; }
  .tag-dd-count { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 11px; }
  .tag-dd-empty { padding: 16px; text-align: center; color: var(--ink-3); font-size: 12px; font-style: italic; }
  .tag-dd-clear {
    border: 0; border-top: 1px solid var(--line);
    background: transparent; color: var(--ink-3); cursor: pointer;
    padding: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
    font-family: 'Söhne', sans-serif;
  }
  .tag-dd-clear:hover { color: var(--ink); background: var(--paper-2); }

  /* === Canvas === */
  .canvas-wrap {
    position: absolute; inset: 0;
    overflow: hidden;
    cursor: grab;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,0.5), transparent 50%),
      var(--paper);
    background-image:
      radial-gradient(circle, rgba(26,20,9,0.055) 1px, transparent 1.5px);
    background-size: 28px 28px;
  }
  .canvas-wrap:active { cursor: grabbing; }
  .canvas-inner {
    position: relative;
    will-change: transform;
  }

  /* === Project cards === */
  .proj-card {
    background: var(--card-bg);
    border-radius: 2px;
    cursor: pointer;
    overflow: hidden;
    display: flex; flex-direction: column;
    font-family: var(--sans);
  }
  .proj-card:hover { background: var(--card-bg-hi); }
  .proj-card-body {
    padding: 12px 14px 14px 14px;
    display: flex; flex-direction: column; gap: 6px;
    flex: 1; position: relative;
  }
  .proj-cluster-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase;
    font-weight: 500;
  }
  .proj-cluster-pill .dot { width: 5px; height: 5px; border-radius: 50%; }
  .proj-title {
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.15;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-wrap: pretty;
  }
  .proj-authors { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 4px; }
  .author-chip {
    font-size: 11px;
    color: var(--ink-2);
    cursor: pointer;
    padding: 2px 0;
    border-bottom: 1px dotted transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .author-chip:hover, .author-chip.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .proj-year {
    position: absolute; right: 14px; bottom: 10px;
    font-family: var(--serif);
    font-size: 10px;
    font-style: italic;
    color: var(--ink-3);
  }

  /* === Detail Panel === */
  .detail-panel {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 420px;
    background: var(--card-bg-hi);
    border-left: 1px solid var(--line);
    z-index: 20;
    padding: 24px 28px;
    overflow-y: auto;
    font-family: var(--sans);
    animation: slideIn 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    box-shadow: -20px 0 40px -20px rgba(24,18,10,0.15);
  }
  @keyframes slideIn {
    from { transform: translateX(40px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  .detail-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .btn-close {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--line); background: transparent;
    font-size: 18px; cursor: pointer; color: var(--ink-2);
  }
  .btn-close:hover { background: var(--paper-2); }
  .detail-year {
    font-family: var(--serif); font-size: 22px; font-style: italic;
    color: var(--ink-3);
  }
  .detail-cluster {
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px;
    margin-bottom: 8px;
  }
  .detail-cluster .dot { width: 6px; height: 6px; border-radius: 50%; }
  .detail-title {
    font-family: var(--serif);
    font-size: 36px; font-weight: 400;
    line-height: 1.05; letter-spacing: -0.02em;
    margin: 0 0 16px 0;
    text-wrap: balance;
  }
  .detail-summary {
    font-size: 14px; line-height: 1.5; color: var(--ink-2);
    margin: 0 0 28px 0;
    text-wrap: pretty;
  }
  .detail-photo {
    margin: 0 0 16px 0;
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
  }
  .detail-photo img {
    display: block; width: 100%; height: auto;
    max-height: 280px; object-fit: cover;
  }
  .detail-repo {
    display: inline-block;
    font-size: 12px; padding: 8px 14px;
    border: 1px solid var(--ink); color: var(--ink);
    text-decoration: none; border-radius: 999px;
    margin-bottom: 24px;
    transition: all 0.15s;
  }
  .detail-repo:hover { background: var(--ink); color: var(--paper); }
  .detail-section { margin-bottom: 24px; }
  .detail-label {
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-3); margin-bottom: 10px;
  }
  .detail-authors { display: flex; flex-direction: column; gap: 12px; }
  .detail-author {
    display: flex; gap: 12px; align-items: flex-start;
    cursor: pointer; padding: 6px; margin: -6px;
    border-radius: 4px;
  }
  .detail-author:hover { background: var(--paper-2); }
  .author-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--ink); color: var(--paper);
    display: grid; place-items: center;
    font-family: var(--serif); font-size: 13px; font-weight: 500;
    flex-shrink: 0;
  }
  .author-name { font-weight: 500; font-size: 13px; }
  .author-bio { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; line-height: 1.4; }
  .detail-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag {
    font-size: 11px; padding: 3px 9px;
    background: var(--paper-2); border-radius: 999px;
    text-transform: capitalize;
  }
  .tag-area { background: oklch(0.94 0.04 50); color: oklch(0.4 0.12 50); }
  .tag-weak { background: oklch(0.94 0.05 280); color: oklch(0.4 0.13 280); }
  .tag-knowledge { background: oklch(0.94 0.04 150); color: oklch(0.4 0.12 150); }
  .detail-related { display: flex; flex-direction: column; gap: 1px; }
  .related-item {
    padding: 10px 12px; margin: 0 -12px;
    cursor: pointer; border-radius: 3px;
    border-top: 1px solid var(--line);
  }
  .related-item:first-child { border-top: 0; }
  .related-item:hover { background: var(--paper-2); }
  .related-title { font-family: var(--serif); font-size: 15px; margin-bottom: 3px; }
  .related-meta {
    display: flex; gap: 10px;
    font-size: 10.5px; color: var(--ink-3);
    letter-spacing: 0.04em;
  }
  .related-shared {
    font-size: 11px; color: var(--accent);
    font-style: italic;
    margin-top: 3px;
  }

  /* === Hints === */
  .footer-credit {
    position: fixed; bottom: 14px; right: 18px;
    z-index: 10;
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.02em;
    font-family: var(--sans);
    pointer-events: auto;
  }
  .footer-credit a {
    color: var(--ink-2);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s;
  }
  .footer-credit a:hover { border-bottom-color: var(--ink-2); }
  .footer-credit em {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    color: var(--ink-2);
  }

  .hints {
    position: fixed; bottom: 16px; left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-size: 11.5px;
    color: var(--ink-3);
    letter-spacing: 0.02em;
    font-family: var(--sans);
    background: rgba(251, 250, 245, 0.88);
    backdrop-filter: blur(6px);
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  .pinned-person {
    display: flex; align-items: center; gap: 10px;
    color: var(--ink);
  }
  .pinned-person strong { color: var(--accent); font-weight: 500; }
  .pin-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .pinned-person button {
    border: 0; background: transparent; color: var(--ink-3);
    font-size: 11px; cursor: pointer; text-decoration: underline;
  }
  .pinned-person button:hover { color: var(--ink); }

  /* === Tweaks panel === */
  /* === Tweaks panel === */
  .tweaks-fab {
    position: fixed; bottom: 16px; left: 16px; z-index: 25;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--card-bg-hi);
    color: var(--ink-2);
    cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 4px 14px -4px rgba(24,18,10,0.18);
    transition: all 0.15s;
  }
  .tweaks-fab:hover { color: var(--ink); border-color: var(--ink-2); transform: translateY(-1px); }
  .tweaks-fab svg { width: 16px; height: 16px; }

  .tweaks {
    position: fixed; z-index: 30;
    background: var(--card-bg-hi);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0;
    width: 260px;
    font-family: var(--sans);
    box-shadow: 0 20px 40px -20px rgba(24,18,10,0.3);
    user-select: none;
  }
  .tweaks-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px 10px 14px;
    cursor: grab;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(0,0,0,0.02), transparent);
    border-radius: 8px 8px 0 0;
  }
  .tweaks-head:active { cursor: grabbing; }
  .tweaks-head h3 {
    font-family: var(--serif); font-size: 13px; margin: 0;
    letter-spacing: 0.02em;
    font-style: italic; font-weight: 400;
  }
  .tweaks-head-actions { display: flex; gap: 4px; align-items: center; }
  .tweaks-btn {
    width: 22px; height: 22px;
    border: 0; background: transparent; cursor: pointer;
    color: var(--ink-3); font-size: 14px; line-height: 1;
    border-radius: 4px;
    display: grid; place-items: center;
  }
  .tweaks-btn:hover { background: var(--paper-2); color: var(--ink); }
  .tweaks-body { padding: 14px; }
  .tweaks-body.collapsed { display: none; }
  .tweak-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; font-size: 11.5px; gap: 12px;
  }
  .tweak-row:last-child { margin-bottom: 0; }
  .tweak-row label { color: var(--ink-3); flex-shrink: 0; }
  .tweak-row .control { display: flex; align-items: center; gap: 8px; flex: 1; justify-content: flex-end; }
  .tweak-row select, .tweak-row input[type="range"] {
    font-family: var(--sans); font-size: 11.5px;
    border: 1px solid var(--line); border-radius: 4px;
    padding: 3px 6px; background: var(--paper);
  }
  .tweak-row input[type="range"] { padding: 0; flex: 1; max-width: 110px; accent-color: var(--ink); }
  .tweak-value { font-variant-numeric: tabular-nums; color: var(--ink-2); min-width: 28px; text-align: right; }
  .tweak-toggle {
    width: 32px; height: 18px; background: var(--line);
    border-radius: 999px; position: relative; cursor: pointer;
    transition: background 0.15s;
  }
  .tweak-toggle.on { background: var(--ink); }
  .tweak-toggle::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: white; transition: transform 0.15s;
  }
  .tweak-toggle.on::after { transform: translateX(14px); }

  /* === Empty/welcome overlay === */
  .intro {
    position: fixed; top: 130px; left: 40px;
    z-index: 5;
    max-width: 320px;
    pointer-events: none;
    background: linear-gradient(to bottom right, rgba(247,243,233,0.96) 40%, rgba(247,243,233,0));
    padding: 20px 30px 40px 0;
  }
  .intro h1 {
    font-family: var(--serif);
    font-size: 56px; font-weight: 300;
    letter-spacing: -0.03em;
    line-height: 0.95;
    margin: 0 0 16px 0;
    text-wrap: balance;
  }
  .intro h1 em { font-style: italic; color: var(--accent); font-weight: 400; }
  .intro p {
    font-size: 13px; color: var(--ink-2);
    line-height: 1.5; margin: 0;
    text-wrap: pretty;
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
<div id="root"></div>

<script src="loader.js"></script>
<script type="text/babel" src="graph.jsx"></script>
<script type="text/babel" src="panels.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showIntro": true,
  "nodeScale": 1.05
}/*EDITMODE-END*/;

function App() {
  const { projects, people, clusters } = window.MDEF_DATA;

  const [filters, setFilters] = useState({ years: new Set(), clusters: new Set(), areas: new Set(), weakSignals: new Set() });
  const [searchQuery, setSearchQuery] = useState('');
  const [selectedProject, setSelectedProject] = useState(null);
  const [selectedPerson, setSelectedPerson] = useState(null);
  const [groupMode, setGroupMode] = useState('year');
  const [viewMode, setViewMode] = useState('both'); // 'both' | 'projects' | 'students'
  const [connectionMode, setConnectionMode] = useState('project-author'); // 'project-author' | 'project-project' | 'student-student' | 'none'
  const [hoverPersonId, setHoverPersonId] = useState(null);
  const [activePersonId, setActivePersonId] = useState(null);
  const [tweaks, setTweaks] = useState(() => {
    try {
      const stored = localStorage.getItem('mdef-tweaks');
      if (stored) return { ...TWEAK_DEFAULTS, ...JSON.parse(stored) };
    } catch (e) {}
    return TWEAK_DEFAULTS;
  });
  const [tweaksOpen, setTweaksOpen] = useState(false);

  // Edit mode toolbar protocol
  useEffect(() => {
    const handler = (e) => {
      const d = e.data || {};
      if (d.type === '__activate_edit_mode') setTweaksOpen(true);
      if (d.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const setTweakKey = (k, v) => {
    setTweaks(t => {
      const nxt = { ...t, [k]: v };
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
      try { localStorage.setItem('mdef-tweaks', JSON.stringify(nxt)); } catch (e) {}
      return nxt;
    });
  };

  useEffect(() => {
    document.body.classList.toggle('dense', !!tweaks.dense);
  }, [tweaks.dense]);

  const stats = {
    years: new Set(projects.map(p => p.year)).size,
    projects: projects.length,
    people: people.length,
  };

  return (
    <>
      <Toolbar
        projects={projects} people={people} clusters={clusters}
        filters={filters} setFilters={setFilters}
        searchQuery={searchQuery} setSearchQuery={setSearchQuery}
        stats={stats}
        groupMode={groupMode} setGroupMode={setGroupMode}
        viewMode={viewMode} setViewMode={setViewMode}
        connectionMode={connectionMode} setConnectionMode={setConnectionMode}
      />

      {tweaks.showIntro && !selectedProject && !searchQuery && !activePersonId && !hoverPersonId && filters.years.size === 0 && filters.clusters.size === 0 && (
        <div className="intro">
          <h1>Four cohorts,<br/>one <em>legacy</em>.</h1>
          <p>An archive of {stats.projects} microchallenges from {stats.people} students across {stats.years} years. Each curved line is a person — carrying their hands, questions and obsessions from one challenge to the next.</p>
        </div>
      )}

      <Graph
        projects={projects} people={people} clusters={clusters}
        filters={filters}
        searchQuery={searchQuery}
        selectedProject={selectedProject}
        setSelectedProject={setSelectedProject}
        hoverPersonId={hoverPersonId}
        setHoverPersonId={setHoverPersonId}
        activePersonId={activePersonId}
        setActivePersonId={setActivePersonId}
        groupMode={groupMode}
        setSelectedPerson={setSelectedPerson}
        nodeScale={tweaks.nodeScale ?? 1}
        viewMode={viewMode}
        connectionMode={connectionMode}
      />

      <Hints
        activePersonId={activePersonId}
        hoverPersonId={hoverPersonId}
        people={people}
        onClearActive={() => setActivePersonId(null)}
      />

      {selectedPerson && (
        <PersonProfile
          person={selectedPerson}
          projects={projects}
          people={people}
          clusters={clusters}
          onClose={() => setSelectedPerson(null)}
          onSelectProject={(p) => { setSelectedPerson(null); setSelectedProject(p); }}
          onSelectPerson={(p) => setSelectedPerson(p)}
        />
      )}

      {selectedProject && (
        <DetailPanel
          project={selectedProject}
          people={people}
          projects={projects}
          clusters={clusters}
          onClose={() => setSelectedProject(null)}
          onSelect={setSelectedProject}
          onHoverPerson={(id, click) => {
            if (click) setActivePersonId(activePersonId === id ? null : id);
            else setHoverPersonId(id);
          }}
        />
      )}

      {!tweaksOpen && (
        <button className="tweaks-fab" onClick={() => setTweaksOpen(true)} title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      )}

      {tweaksOpen && (
        <TweaksPanel
          tweaks={tweaks}
          setTweakKey={setTweakKey}
          onClose={() => {
            setTweaksOpen(false);
            window.parent.postMessage({type: '__edit_mode_dismissed'}, '*');
          }}
        />
      )}

      <div className="footer-credit">
        Created with <em>love</em> by <a href="https://fablabbcn.org" target="_blank" rel="noopener noreferrer">Santi Fuentemilla</a> @ Fab Lab Barcelona · <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-NC-SA 4.0</a>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<BootGate />);

function TweaksPanel({ tweaks, setTweakKey, onClose }) {
  const [pos, setPos] = useState({ x: window.innerWidth - 280, y: window.innerHeight - 240 });
  const [collapsed, setCollapsed] = useState(false);
  const dragRef = React.useRef(null);

  const onHeadDown = (e) => {
    if (e.target.closest('.tweaks-btn')) return;
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const startPos = { ...pos };
    const onMove = (ev) => {
      const W = 260;
      const H = collapsed ? 44 : 240;
      const nx = Math.max(8, Math.min(window.innerWidth - W - 8, startPos.x + ev.clientX - startX));
      const ny = Math.max(8, Math.min(window.innerHeight - H - 8, startPos.y + ev.clientY - startY));
      setPos({ x: nx, y: ny });
    };
    const onUp = () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  };

  return (
    <div className="tweaks" style={{ left: pos.x, top: pos.y }} ref={dragRef}>
      <div className="tweaks-head" onMouseDown={onHeadDown}>
        <h3>Tweaks</h3>
        <div className="tweaks-head-actions">
          <button className="tweaks-btn" title={collapsed ? 'Expand' : 'Collapse'} onClick={() => setCollapsed(c => !c)}>
            {collapsed ? '+' : '−'}
          </button>
          <button className="tweaks-btn" title="Close" onClick={onClose}>×</button>
        </div>
      </div>
      <div className={'tweaks-body' + (collapsed ? ' collapsed' : '')}>
        <div className="tweak-row">
          <label>Intro text</label>
          <div className="control">
            <div className={'tweak-toggle' + (tweaks.showIntro ? ' on' : '')}
              onClick={() => setTweakKey('showIntro', !tweaks.showIntro)} />
          </div>
        </div>
        <div className="tweak-row">
          <label>Node size</label>
          <div className="control">
            <input type="range" min="0.5" max="2" step="0.05"
              value={tweaks.nodeScale ?? 1}
              onChange={e => setTweakKey('nodeScale', parseFloat(e.target.value))} />
            <span className="tweak-value">{(tweaks.nodeScale ?? 1).toFixed(2)}×</span>
          </div>
        </div>
      </div>
    </div>
  );
}

function BootGate() {
  const [ready, setReady] = useState(!!window.MDEF_DATA);
  useEffect(() => {
    if (window.MDEF_DATA) { setReady(true); return; }
    const onReady = () => setReady(true);
    window.addEventListener('mdef-data-ready', onReady);
    return () => window.removeEventListener('mdef-data-ready', onReady);
  }, []);
  if (!ready) return null;
  return <App />;
}
</script>
</body>
